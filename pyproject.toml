# =============================================================================
# Python package and pixi environment for the replication of
#   Deo et al. 2024, Sci Rep, "Brain control of bimanual movement enabled by
#   recurrent neural networks" (doi:10.1038/s41598-024-51617-3).
#
# Usage:
#   pixi install            # create/refresh the environment from pixi.lock
#   pixi run test           # run unit tests
#   pixi run <task>         # see [tool.pixi.tasks] below
# =============================================================================

[project]
name = "bimanual"
version = "0.1.0"
description = "Python replication of Deo et al. 2024 bimanual BCI analyses"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bimanual"]

# --- pixi workspace ----------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

# The RTX 3050 driver reports CUDA 12.7; the torch wheels below use CUDA 12.6.
[tool.pixi.system-requirements]
cuda = "12"

# Packages taken from conda-forge.
[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
pandas = "*"
matplotlib = "*"
h5py = "*"
numba = "*"
pytest = "*"
# Use OpenBLAS (no OpenMP) instead of MKL: conda-forge MKL loads LLVM libomp.dll, which
# clashes with the Intel libiomp5md.dll bundled in the PyTorch wheel ("OMP: Error #15").
libblas = { version = "*", build = "*openblas" }

# Packages taken from PyPI.
[tool.pixi.pypi-dependencies]
bimanual = { path = ".", editable = true }
# CUDA build of PyTorch from the official PyTorch wheel index.
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }
# Demixed PCA (Kobak et al. 2016), reference Python implementation.
dPCA = { git = "https://github.com/machenslab/dPCA", subdirectory = "python" }

# Named commands; more are added as each phase is implemented.
[tool.pixi.tasks]
test = "pytest -q tests"
inventory = "python scripts/01_inventory.py"
compare-reference = "python scripts/compare_reference.py"
fig1-tuning = "python scripts/fig1_tuning.py"
fig1-anova = "python scripts/fig1_supp_anova.py"
fig2-tuning = "python scripts/fig2_tuning_change.py"
fig2-pca = "python scripts/fig2_pca.py"
fig2-dpca = "python scripts/fig2_dpca.py"
fig3-decoding = "python scripts/fig3_decoding.py"
fig3-sim = "python scripts/fig3_simulations.py"
fig4-rnn = "python -u scripts/fig4_rnn.py"
fig5-behavior = "python scripts/fig5_behavior.py"
ext-lstm = "python -u scripts/ext_lstm.py"
ext-arrays = "python -u scripts/ext_arrays.py"
# Phases 8 + 9 GPU work in one background job: LSTM/GRU search, then the one-array runs and the zero-out evaluation
ext-driver = "python -u scripts/ext_lstm.py --stage search && python -u scripts/ext_arrays.py --stage run && python -u scripts/ext_arrays.py --stage zero"
# Phase 10: feasibility tests (job queue; stages smoke | jobs | drive | worker | mute | plot)
ext-feas = "python -u scripts/ext_feasibility.py"
ext-feas-driver = "python -u scripts/ext_feasibility.py --stage drive --workers 1"
ext-select = "python -u scripts/ext_select.py"
# Phase 11: TX vs SBP on the Rigotti-Thompson T5 files (CPU only; -I because it reads downloaded .h5)
ext-sbp = { cmd = "python -I -u scripts/ext_sbp.py", env = { CUDA_VISIBLE_DEVICES = "", OMP_NUM_THREADS = "4" } }
ext-sbp-plot = "python -u scripts/ext_sbp_plot.py"
check-gpu = "python -c \"import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')\""
